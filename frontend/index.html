    <!--
      Analytics and ad pixels load on the website only. Inside the YNeet Android app
      (Play Store, ?app=1 / framed / android-app referrer) nothing is loaded: the app is
      in Google Play's Families programme (Class 6-8 students), which doesn't allow
      ad-measurement trackers.
    -->
    <script>
      window.__yneetNoTrack = (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (q.get("app") === "1" || q.get("framed") === "1") { sessionStorage.setItem("yneet_app_mode", "1"); return true; }
          if ((document.referrer || "").indexOf("android-app://") === 0) return true;
          if (sessionStorage.getItem("yneet_app_mode") === "1") return true;
          return window.self !== window.top;
        } catch (e) { return true; }
      })();
    </script>
    <!--
      Speed: the gtag.js and Meta Pixel scripts (~400 KB of JavaScript) used to
      load straight away and compete with the page itself. Their command queues
      (gtag(), fbq()) are still set up immediately, so no event is lost; only the
      script download waits until the page has finished loading (or the visitor
      first taps/scrolls, whichever comes first).
    -->
    <script>
      window.__yneetLater = function (fn) {
        var done = false, go = function () { if (done) return; done = true; fn(); };
        var idle = function () { (window.requestIdleCallback || setTimeout)(go, { timeout: 3000 }); };
        if (document.readyState === "complete") idle(); else window.addEventListener("load", function () { setTimeout(idle, 1500); });
        ["pointerdown", "keydown", "scroll", "touchstart"].forEach(function (ev) { window.addEventListener(ev, go, { once: true, passive: true }); });
      };
    </script>
